---
- name: Create deployment configuration directory
  ansible.builtin.file:
    path: "{{ crimewatch_deploy_dir }}"
    state: directory
    mode: "0750"

- name: Write protected application environment
  ansible.builtin.template:
    src: crimewatch.env.j2
    dest: "{{ crimewatch_deploy_dir }}/crimewatch.env"
    mode: "0600"
  no_log: true

- name: Inspect CrimeWatch Docker network
  ansible.builtin.command: docker network inspect crimewatch_net
  register: network_state
  changed_when: false
  failed_when: false

- name: Create CrimeWatch Docker network
  ansible.builtin.command: docker network create crimewatch_net
  when: network_state.rc != 0
  changed_when: true

- name: Inspect PostgreSQL volume
  ansible.builtin.command: docker volume inspect crimewatch_postgres_data
  register: postgres_volume
  changed_when: false
  failed_when: false

- name: Create persistent PostgreSQL volume
  ansible.builtin.command: docker volume create crimewatch_postgres_data
  when: postgres_volume.rc != 0
  changed_when: true

- name: Pull external service images
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ (crimewatch_deploy_dir + '/crimewatch.env') | quote }}
      -f {{ (crimewatch_project_dir + '/docker-compose.yml') | quote }} pull postgres nginx
  register: pull_result
  changed_when: "'Pulled' in pull_result.stdout or 'Downloaded' in pull_result.stdout"

- name: Build and reconcile CrimeWatch containers
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ (crimewatch_deploy_dir + '/crimewatch.env') | quote }}
      -f {{ (crimewatch_project_dir + '/docker-compose.yml') | quote }} up -d --build --remove-orphans --wait
  register: compose_result
  changed_when: "'Created' in compose_result.stdout or 'Recreated' in compose_result.stdout or 'Built' in compose_result.stdout"

- name: Verify backend health endpoint
  ansible.builtin.uri:
    url: http://localhost:18080/actuator/health
    method: GET
    status_code: 200
    return_content: true
  register: backend_health
  retries: 12
  delay: 5
  until: backend_health.status == 200 and backend_health.json.status == 'UP'

- name: Verify reverse proxy and frontend
  ansible.builtin.uri:
    url: http://localhost:3000/
    method: GET
    status_code: 200
  register: frontend_health
  retries: 8
  delay: 4
  until: frontend_health.status == 200

- name: Read final container state
  ansible.builtin.command:
    cmd: docker compose -f {{ (crimewatch_project_dir + '/docker-compose.yml') | quote }} ps
  register: final_containers
  changed_when: false

- name: Display deployment verification
  ansible.builtin.debug:
    var: final_containers.stdout_lines

