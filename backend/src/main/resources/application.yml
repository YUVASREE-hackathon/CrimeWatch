spring:
  application:
    name: crimewatch-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/crimewatch}
    username: ${DATABASE_USERNAME:crimewatch}
    password: ${DATABASE_PASSWORD:crimewatch}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
app:
  jwt:
    secret: ${JWT_SECRET:crimewatch-development-secret-key-change-before-deployment}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  demo-data: ${DEMO_DATA_ENABLED:true}

