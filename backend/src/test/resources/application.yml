spring:
  datasource:
    url: jdbc:h2:mem:crimewatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  main:
    allow-bean-definition-overriding: true
app:
  jwt:
    secret: test-secret-key-that-is-at-least-thirty-two-characters
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  demo-data: false

