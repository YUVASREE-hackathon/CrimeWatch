name: crimewatch

services:
  postgres:
    image: postgres:17-alpine
    container_name: crimewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crimewatch}
      POSTGRES_USER: ${POSTGRES_USER:-crimewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimewatch-local-password}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [crimewatch_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    image: crimewatch/backend:${IMAGE_TAG:-local}
    container_name: crimewatch-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crimewatch}
      DATABASE_USERNAME: ${POSTGRES_USER:-crimewatch}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-crimewatch-local-password}
      JWT_SECRET: ${JWT_SECRET:-crimewatch-local-jwt-secret-change-before-sharing}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:3000}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    ports:
      - "18080:8080"
    volumes:
      - evidence_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [crimewatch_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 8

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: crimewatch/frontend:${IMAGE_TAG:-local}
    container_name: crimewatch-frontend
    restart: unless-stopped
    expose: ["80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [crimewatch_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 4s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    container_name: crimewatch-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [crimewatch_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 15s
      timeout: 4s
      retries: 5

networks:
  crimewatch_net:
    name: crimewatch_net
    driver: bridge

volumes:
  postgres_data:
    name: crimewatch_postgres_data
  evidence_data:
    name: crimewatch_evidence_data
